<title>ORCHIDEE Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f1; --panel:#fcfdfb; --panel2:#eef1ec; --ink:#1d2420; --muted:#5f6b60;
  --line:#dde3da; --accent:#2f6b4f; --accent-ink:#ffffff; --grid:#e4e8e1;
  --bare:#e3e6df; --sea:#f3f5f1; --hl:#1d2420; --c0:#7a5c12;
  --fire:#c0392b; --storm:#1f77b4; --pest:#8c564b; --harv:#8a7a1e;
  --tab-on:#2f6b4f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12171a; --panel:#1a2124; --panel2:#151b1e; --ink:#e4eae4; --muted:#94a198;
    --line:#2b3430; --accent:#6fbc92; --accent-ink:#0e1512; --grid:#242c28;
    --bare:#232a26; --sea:#12171a; --hl:#e4eae4; --c0:#b08f3a;
    --fire:#e0604f; --storm:#5aa2d6; --pest:#b07f6e; --harv:#b3a13f;
    --tab-on:#6fbc92;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12171a; --panel:#1a2124; --panel2:#151b1e; --ink:#e4eae4; --muted:#94a198;
  --line:#2b3430; --accent:#6fbc92; --accent-ink:#0e1512; --grid:#242c28;
  --bare:#232a26; --sea:#12171a; --hl:#e4eae4; --c0:#b08f3a;
  --c1:#7fd492; --c2:#4fc2d3; --c3:#7aa6ee; --c4:#b48ae0;
  --s1:#2e6b3c; --s2:#1f5b66; --s3:#2d4a7a; --s4:#59397a; --c0:#b08f3a;
  --fire:#e0604f; --storm:#5aa2d6; --pest:#b07f6e; --harv:#b3a13f;
  --tab-on:#6fbc92;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif; margin:0; padding:0 20px 40px;}
header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:18px 2px 10px; border-bottom:1px solid var(--line); margin-bottom:12px;}
header h1{font:700 22px/1.1 Archivo,system-ui,sans-serif; margin:0; letter-spacing:.2px;}
header .sub{color:var(--muted); font-size:13px;}
header .sub b{color:var(--ink); font-weight:600;}
.controls{display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; margin-bottom:12px;}
.vargroups{display:flex; gap:14px; flex-wrap:wrap; flex:1 1 480px;}
.vgroup{display:flex; flex-direction:column; gap:5px;}
.vgroup .glabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600;}
.chips{display:flex; gap:5px; flex-wrap:wrap;}
.chip{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:14px; padding:3px 11px; font-size:12.5px; cursor:pointer; font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.timebox{display:flex; flex-direction:column; gap:4px; min-width:230px;}
.timebox .glabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600;}
.timerow{display:flex; align-items:center; gap:8px;}
.timerow input[type=range]{flex:1; accent-color:var(--accent);}
#yearlab{font:500 14px "IBM Plex Mono",monospace; min-width:44px; text-align:right;}
#playbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; width:26px; height:24px; cursor:pointer; font-size:11px; line-height:1;}
#playbtn:hover{border-color:var(--accent);}
.legendbox{display:flex; flex-direction:column; gap:3px; min-width:190px;}
.legendbox .glabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600;}
#cbar{width:190px; height:12px; border-radius:3px; border:1px solid var(--line);}
.cbarlabs{display:flex; justify-content:space-between; font:400 11px "IBM Plex Mono",monospace; color:var(--muted);}
main{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
#mapcard{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; position:relative; flex:0 0 auto;}
#map{display:block; cursor:crosshair;}
#maptip{position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.14); display:none; z-index:5; max-width:230px;}
#maptip .tv{font-family:"IBM Plex Mono",monospace; font-weight:500;}
#maptip .tc{color:var(--muted); font-size:11px;}
.mapnote{color:var(--muted); font-size:11.5px; margin-top:6px;}
#fichezone{flex:1 1 560px; min-width:420px;}
#tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; min-height:26px;}
.tab{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); border-radius:6px 6px 0 0; padding:3px 8px 3px 10px; font:500 12px "IBM Plex Mono",monospace; cursor:pointer; color:var(--muted);}
.tab.on{color:var(--ink); border-bottom:2px solid var(--tab-on); font-weight:600;}
.tab .x{cursor:pointer; color:var(--muted); font-size:13px; padding:0 2px; border:none; background:none; font-family:inherit;}
.tab .x:hover{color:var(--fire);}
#fiche{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px;}
#fiche .placeholder{color:var(--muted); padding:60px 20px; text-align:center; font-size:13.5px;}
.fhead{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:10px;}
.fhead h2{font:600 16px Archivo,system-ui,sans-serif; margin:0;}
.fhead .coord{font:500 13px "IBM Plex Mono",monospace; color:var(--muted);}
.fhead .fmeta{color:var(--muted); font-size:12.5px;}
.fgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:14px;}
.panel h3{font:600 12.5px "IBM Plex Sans",sans-serif; margin:0 0 2px; letter-spacing:.01em;}
.panel .unit{color:var(--muted); font-weight:400;}
.panel canvas{display:block; width:100%; height:150px;}
.lgd{display:flex; gap:9px; flex-wrap:wrap; font-size:10.5px; color:var(--muted); margin:2px 0 3px;}
.lgd span{display:inline-flex; align-items:center; gap:4px;}
.lgd i{width:10px; height:3px; border-radius:2px; display:inline-block;}
.donuts{display:flex; gap:20px; flex-wrap:wrap; margin-top:4px;}
.donut{display:flex; gap:10px; align-items:center;}
.donut canvas{width:92px; height:92px;}
.dlgd{font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:2px;}
.dlgd b{color:var(--ink); font-weight:500; font-family:"IBM Plex Mono",monospace;}
.chartip{position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:11.5px; box-shadow:0 2px 10px rgba(0,0,0,.14); display:none; z-index:9;}
.chartip .row{display:flex; align-items:center; gap:5px; white-space:nowrap;}
.chartip i{width:8px; height:8px; border-radius:2px; display:inline-block;}
.chartip .v{font-family:"IBM Plex Mono",monospace; margin-left:auto; padding-left:8px;}
footer{margin-top:22px; border-top:1px solid var(--line); padding-top:10px; color:var(--muted); font-size:12px; max-width:900px;}
footer p{margin:4px 0;}
@media (max-width:1150px){ main{flex-direction:column;} #fichezone{min-width:0; width:100%;} }
</style>

<header>
  <h1 id="h1">ORCHIDEE Atlas</h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="controls">
  <div class="vargroups" id="vargroups"></div>
  <div class="timebox">
    <div class="glabel">Year</div>
    <div class="timerow">
      <button id="playbtn" title="Animate the years">▶</button>
      <input type="range" id="yearslider" min="0" max="0" value="0">
      <span id="yearlab"></span>
    </div>
  </div>
  <div class="legendbox">
    <div class="glabel" id="cbartitle">Scale</div>
    <canvas id="cbar" width="190" height="12"></canvas>
    <div class="cbarlabs"><span id="cbmin"></span><span id="cbmid"></span><span id="cbmax"></span></div>
  </div>
</div>

<main>
  <div id="mapcard">
    <canvas id="map"></canvas>
    <div id="maptip"></div>
    <div class="mapnote" id="mapnote"></div>
  </div>
  <div id="fichezone">
    <div id="tabs"></div>
    <div id="fiche"><div class="placeholder">Click a grid cell on the map to open its pixel plate.<br>
    Each open plate stays available in a tab above.</div></div>
  </div>
</main>

<div class="chartip" id="chartip"></div>

<footer id="footer"></footer>

<script>
"use strict";
const META = __META__;
const CUBE_B64 = "__CUBE__";
const ESS_B64 = "__ESS__";

// ═══════════════════════════ blob decoding ═══════════════════════════
function b64bytes(s){ const bin=atob(s), u=new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
const RAW = pako.inflate(b64bytes(CUBE_B64));
const Q = new Int16Array(RAW.buffer, RAW.byteOffset, RAW.byteLength>>1);
const NYR=META.nyr, NPIX=META.npix, YEARS=META.years, NCLS=META.ncls;
const S={}; META.series.forEach((s,i)=>S[s.name]=i);
const OFF=META.series.map(s=>s.off), SC=META.series.map(s=>s.scale);
function val(s,p,y){ const q=Q[(s*NPIX+p)*NYR+y]; return q===-32768?NaN:q*SC[s]+OFF[s]; }
function serie(s,p){ const a=new Float64Array(NYR); for (let y=0;y<NYR;y++) a[y]=val(s,p,y); return a; }
function cserie(key,k,p){ return serie(S[key+"_c"+(k+1)],p); }   // class k (0-based)

// per-species blob: int8, layout [pixel][species][variable][class][year]
const ERAW = pako.inflate(b64bytes(ESS_B64));
const EQ = new Int8Array(ERAW.buffer, ERAW.byteOffset, ERAW.byteLength);
const PIX_ESS=META.pix_ess, ESTEPS=META.ess_steps, NEV=ESTEPS.length;
const essOff=new Array(NPIX);
{ let o=0; for (let p=0;p<NPIX;p++){ essOff[p]=o; o+=PIX_ESS[p].length*NEV*NCLS*NYR; } }
function essVal(p,el,v,k,y){ const q=EQ[essOff[p]+((el*NEV+v)*NCLS+k)*NYR+y];
  return q===-128?NaN:(q+124)*ESTEPS[v]; }
function essSerie(p,el,v,k){ const a=new Float64Array(NYR);
  for (let y=0;y<NYR;y++) a[y]=essVal(p,el,v,k,y); return a; }
const EAREA = 0;                     // area always opens the per-species blob

const fmtNum=(d)=>new Intl.NumberFormat('en-GB',{maximumFractionDigits:d,minimumFractionDigits:0});
const FMT=[0,1,2,3].map(fmtNum), F0=FMT[0], F1=FMT[1];
const fmtOf=(d)=>FMT[Math.max(0,Math.min(3,d|0))];
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// ═══════════════════════════ colours ═══════════════════════════
// Age classes = an ORDERED quantity -> sequential ramp with monotonic luminance
// (viridis), windowed per theme to keep >= 3:1 contrast against the background.
// It stretches over any number of classes.
const VIRIDIS=["#440154","#46327e","#365c8d","#277f8e","#1fa187","#4ac16d","#a0da39","#fde725"];
// Named series (disturbances, species…) = identities -> categorical theme in
// FIXED order, 6 validated hues (CVD + contrast); beyond that: "others".
const CAT_LIGHT=["#e34948","#2a78d6","#eda100","#1baf7a","#4a3aa7","#e87ba4"];
const CAT_DARK =["#e94f4d","#408cec","#c37a00","#00a671","#827aed","#ce648d"];
const CAT_REST="#9a9a92";
function lum(hex){ const v=[1,3,5].map(i=>parseInt(hex.substr(i,2),16)/255)
    .map(c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4));
  return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2]; }
function isDark(){ const b=css("--bg"); return b.startsWith("#") ? lum(b)<0.4 : false; }
function mix(c1,c2,t){ const h=(c)=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
  const a=h(c1), b=h(c2);
  return "#"+[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t).toString(16).padStart(2,"0")).join(""); }
function rampAt(stops,t){ t=Math.max(0,Math.min(1,t));
  const x=t*(stops.length-1), i=Math.min(stops.length-2,Math.floor(x));
  return mix(stops[i],stops[i+1],x-i); }
function clsColor(k){                          // k = 0..NCLS-1
  const d=isDark(), lo=d?0.46:0.0, hi=d?1.0:0.52;
  return rampAt(VIRIDIS, lo+(hi-lo)*(NCLS>1?k/(NCLS-1):0.5));
}
function catColor(i){ const P=isDark()?CAT_DARK:CAT_LIGHT; return i<P.length?P[i]:CAT_REST; }
// map ramps: sequential, one hue from light to dark
const RAMPS={
  green:["#eaf4e4","#c2e3b6","#8fcb8a","#57a86a","#2c7f4d","#0f5433","#06331e"],
  gold :["#f7f2e0","#e8dcab","#d3c073","#b6a044","#907d26","#685912","#402f06"],
  fire :["#fdf0e6","#f8cba4","#f09d66","#df6a3a","#bb3d1d","#8a220c","#5c1404"],
  storm:["#eaf1fa","#c3d8f2","#93bbe8","#5f9ad8","#3572b8","#1c4f8f","#0d366b"],
  pest :["#f6efe9","#e3cdbb","#cba98d","#b08363","#8c5e41","#663f28","#442817"],
  harv :["#f4f2e3","#e0dab0","#c5bd7c","#a49a4e","#7f772e","#5a5419","#38340c"],
  edge :["#eef2f5","#c9d8e2","#9cbac9","#6d97ad","#45758e","#26566e","#123a4e"],
  carbon:["#eef6f4","#c9e6df","#9bd2c6","#66b8a8","#3d9788","#26746a","#12504a"],
  // diverging (sink / source): two hues + a neutral in the middle, never a
  // rainbow; the neutral follows the theme so that "zero" reads as background.
  balance:["#8c510a","#bf812d","#dfc27d","#f2f2f0","#80cdc1","#35978f","#01665e"],
};
const RAMPS_DARK={
  balance:["#e0a458","#c98430","#8f6a35","#2f3a36","#3f8f85","#4fbdac","#7fd9c9"],
};
function rampColor(name,t){
  const stops=(isDark()&&RAMPS_DARK[name])||RAMPS[name]||RAMPS.green;
  return rampAt(stops,t);
}

// ═══════════════════════════ map layers ═══════════════════════════
// The catalogue comes from atlas_config.py: num/den are series, scale the
// display factor. Nothing is hard-coded here.
const AMIN=1e-3;
const LAYERS=META.layers.map(L=>Object.assign({},L,{fmt:fmtOf(L.dec)}));
function layerVal(L,p,y){
  const n=val(S[L.num],p,y);
  if (!isFinite(n)) return NaN;
  if (!L.den) return n*L.scale;
  const d=val(S[L.den],p,y);
  return (isFinite(d)&&d>AMIN) ? L.scale*n/d : NaN;
}
// robust domains (p2–p98, one year in four)
for (const L of LAYERS){
  const vals=[];
  const step=Math.max(1,Math.floor(NYR/6));
  for (let y=0;y<NYR;y+=step) for (let p=0;p<NPIX;p++){ const v=layerVal(L,p,y); if (isFinite(v)) vals.push(v); }
  vals.sort((a,b)=>a-b);
  const n=vals.length;
  L.lo = n? vals[Math.floor(0.02*n)] : 0;
  L.hi = n? vals[Math.min(n-1,Math.floor(0.98*n))] : 1;
  if (L.zero) L.lo=0;
  if (L.div){ const m=Math.max(Math.abs(L.lo),Math.abs(L.hi))||1; L.lo=-m; L.hi=m; }
  if (L.hi<=L.lo) L.hi=L.lo+1;
  L.empty = n===0;
}

// ═══════════════════════════ state & controls ═══════════════════════════
let curVar = LAYERS.find(L=>!L.empty) || LAYERS[0];
let curYear = NYR-1;
let selPix = -1;
const ficheCache = new Map();
let playTimer = null;

document.title = META.title;
document.getElementById("h1").textContent = META.title;
document.getElementById("subtitle").innerHTML =
  `Simulation <b>${META.run}</b> · ${META.res} grid · ${META.npix} forest cells ·
   years <b>${YEARS[0]}–${YEARS[NYR-1]}</b> · ${META.essences.length} species ×
   ${NCLS} age class${NCLS>1?"es":""} · click a cell to open its pixel plate.` +
  ((META.dropped||[]).length
    ? ` <span title="fields absent from the simulation, or with no value anywhere on the domain">Fields
       with no data in this run, dropped from the page: ${META.dropped.join(", ")}.</span>`
    : (META.missing.length ? ` <span title="these fields do not exist in the simulation">Fields
       absent from the run (empty panels): ${META.missing.join(", ")}.</span>` : ""));

const groupsDiv=document.getElementById("vargroups");
for (const g of [...new Set(LAYERS.map(v=>v.group))]){
  const gd=document.createElement("div"); gd.className="vgroup";
  if (g) gd.innerHTML=`<div class="glabel">${g}</div>`;
  const ch=document.createElement("div"); ch.className="chips";
  for (const L of LAYERS.filter(v=>v.group===g)){
    const b=document.createElement("button"); b.className="chip"; b.textContent=L.label;
    if (L.empty){ b.title="no data in this run"; b.style.opacity=.45; }
    if (L===curVar) b.classList.add("on");
    b.onclick=()=>{ curVar=L;
      [...document.querySelectorAll(".vargroups .chip")].forEach(c=>c.classList.remove("on"));
      b.classList.add("on"); drawMap(); drawCbar(); };
    ch.appendChild(b);
  }
  gd.appendChild(ch); groupsDiv.appendChild(gd);
}

const slider=document.getElementById("yearslider");
slider.max=NYR-1; slider.value=curYear;
const yearlab=document.getElementById("yearlab");
yearlab.textContent=YEARS[curYear];
slider.oninput=()=>{ curYear=+slider.value; yearlab.textContent=YEARS[curYear]; drawMap(); };
const playbtn=document.getElementById("playbtn");
playbtn.onclick=()=>{
  if (playTimer){ clearInterval(playTimer); playTimer=null; playbtn.textContent="▶"; return; }
  playbtn.textContent="⏸";
  if (curYear>=NYR-1) curYear=0;
  playTimer=setInterval(()=>{ curYear++;
    if (curYear>=NYR-1){ clearInterval(playTimer); playTimer=null; playbtn.textContent="▶"; }
    slider.value=curYear; yearlab.textContent=YEARS[curYear]; drawMap(); },130);
};

// ═══════════════════════════ map ═══════════════════════════
// Projection chosen from the extent: Lambert azimuthal equal-area centred
// on the domain (regional), plate carrée beyond 150° of longitude (global).
const G=META.grid, GLAT=G.lat, GLON=G.lon, HLA=G.dlat/2, HLO=G.dlon/2;
const BORDERS = __BORDERS__;
const RAD=Math.PI/180, LAM0=G.lon0*RAD, PHI1=G.lat0*RAD;
const SPANLON=Math.abs(GLON[GLON.length-1]-GLON[0])+G.dlon;
const GLOBAL=SPANLON>150;
function proj(lon,lat){
  if (GLOBAL) return [lon*RAD*Math.cos(PHI1), -lat*RAD];
  const lam=lon*RAD, phi=lat*RAD;
  const den=1+Math.sin(PHI1)*Math.sin(phi)+Math.cos(PHI1)*Math.cos(phi)*Math.cos(lam-LAM0);
  const k=Math.sqrt(2/Math.max(den,1e-9));
  return [k*Math.cos(phi)*Math.sin(lam-LAM0),
          -k*(Math.cos(PHI1)*Math.sin(phi)-Math.sin(PHI1)*Math.cos(phi)*Math.cos(lam-LAM0))];
}
let pxmin=1e9,pxmax=-1e9,pymin=1e9,pymax=-1e9;
for (const la of GLAT) for (const lo of GLON)
  for (const d of [[-HLO,-HLA],[HLO,-HLA],[HLO,HLA],[-HLO,HLA]]){
    const [x,y]=proj(lo+d[0],la+d[1]);
    pxmin=Math.min(pxmin,x); pxmax=Math.max(pxmax,x);
    pymin=Math.min(pymin,y); pymax=Math.max(pymax,y);
  }
const MAXW=680, MAXH=780, PAD=8;
const MSC=Math.min((MAXW-2*PAD)/Math.max(pxmax-pxmin,1e-9),
                   (MAXH-2*PAD)/Math.max(pymax-pymin,1e-9));
const MW=Math.ceil((pxmax-pxmin)*MSC)+2*PAD, MH=Math.ceil((pymax-pymin)*MSC)+2*PAD;
function P(lon,lat){ const [x,y]=proj(lon,lat); return [(x-pxmin)*MSC+PAD,(y-pymin)*MSC+PAD]; }
const mapC=document.getElementById("map");
const DPR=window.devicePixelRatio||1;
mapC.width=MW*DPR; mapC.height=MH*DPR; mapC.style.width=MW+"px"; mapC.style.height=MH+"px";
const mctx=mapC.getContext("2d"); mctx.scale(DPR,DPR);
document.getElementById("mapnote").textContent =
  `Grey cells: land with no simulated forest. ${GLOBAL ? "Plate carrée projection"
   : `Lambert azimuthal equal-area projection (${G.lat0}°N, ${G.lon0}°E)`} ;
   borders and coastlines from Natural Earth.`;

function cellQuad(iy,ix){
  const la=GLAT[iy], lo=GLON[ix];
  return [P(lo-HLO,la-HLA),P(lo+HLO,la-HLA),P(lo+HLO,la+HLA),P(lo-HLO,la+HLA)];
}
const pixQuad=new Array(NPIX);
for (let p=0;p<NPIX;p++) pixQuad[p]=cellQuad(META.iy[p],META.ix[p]);
const bareQuad=META.bare_iy.map((j,i)=>cellQuad(j,META.bare_ix[i]));
function quadPath(g,q){ g.beginPath(); g.moveTo(q[0][0],q[0][1]);
  for (let i=1;i<4;i++) g.lineTo(q[i][0],q[i][1]); g.closePath(); }
function fillQuad(q,color){
  quadPath(mctx,q); mctx.fillStyle=color; mctx.fill();
  // thin stroke in the same colour: fills the seams between neighbouring quads
  mctx.strokeStyle=color; mctx.lineWidth=0.8; mctx.stroke();
}
function rampT(L,v){ const t=(v-L.lo)/(L.hi-L.lo); return L.rev?1-t:t; }
function drawMap(){
  mctx.clearRect(0,0,MW,MH);
  const bare=css("--bare");
  for (const q of bareQuad) fillQuad(q,bare);
  const {lo,hi}=curVar;
  for (let p=0;p<NPIX;p++){
    const v=layerVal(curVar,p,curYear);
    fillQuad(pixQuad[p], isFinite(v)?rampColor(curVar.ramp,rampT(curVar,v)):bare);
  }
  mctx.strokeStyle=css("--muted"); mctx.globalAlpha=0.55; mctx.lineWidth=0.8; mctx.lineJoin="round";
  for (const seg of BORDERS){
    mctx.beginPath();
    const [x0,y0]=P(seg[0][0],seg[0][1]); mctx.moveTo(x0,y0);
    for (let i=1;i<seg.length;i++){ const [x,y]=P(seg[i][0],seg[i][1]); mctx.lineTo(x,y); }
    mctx.stroke();
  }
  mctx.globalAlpha=1;
  if (selPix>=0){ quadPath(mctx,pixQuad[selPix]);
    mctx.lineWidth=2; mctx.strokeStyle=css("--hl"); mctx.stroke(); }
}
function drawCbar(){
  const c=document.getElementById("cbar"), g=c.getContext("2d");
  for (let x=0;x<190;x++){
    const t=x/189; g.fillStyle=rampColor(curVar.ramp,curVar.rev?1-t:t); g.fillRect(x,0,1,12); }
  document.getElementById("cbartitle").textContent=
    curVar.label+(curVar.unit?` (${curVar.unit})`:"");
  document.getElementById("cbmin").textContent=

function inQuad(q,x,y){
  let inside=false;
  for (let i=0,j=3;i<4;j=i++){
    const xi=q[i][0], yi=q[i][1], xj=q[j][0], yj=q[j][1];
    if ((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}
function pixAt(mx,my){
  for (let p=0;p<NPIX;p++){ const q=pixQuad[p];
    if (mx<Math.min(q[0][0],q[3][0])-1 || mx>Math.max(q[1][0],q[2][0])+1) continue;
    if (inQuad(q,mx,my)) return p; }
  return -1;
}
const maptip=document.getElementById("maptip");
mapC.addEventListener("mousemove",(e)=>{

function fmtCoord(p){

// ═══════════════════════════ chart engine ═══════════════════════════
const chartip=document.getElementById("chartip");
let collector=[];
function allCharts(){ const out=[]; for (const e of ficheCache.values()) out.push(...e.charts); return out; }
function mkCanvas(host,h){
  const c=document.createElement("canvas");
  host.appendChild(c);
  const draw=(fn)=>{ const w=c.clientWidth||300;
    c.width=w*DPR; c.height=h*DPR; c.style.height=h+"px";
    const g=c.getContext("2d"); g.setTransform(DPR,0,0,DPR,0,0); fn(g,w,h); };
  return {c,draw};
}
function niceTicks(lo,hi,n){
  if (!(hi>lo)) hi=lo+1;
  const span=hi-lo, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)||mag*10;
  const out=[];
  for (let t=Math.ceil(lo/step)*step;t<=hi+1e-9;t+=step) out.push(t);
  return out;
}
const colOf=(sr)=> typeof sr.color==="function" ? sr.color()
                 : (sr.color.startsWith("--") ? css(sr.color) : sr.color);
// generic chart: opts={series:[{name,color,vals}], fmt, stack, ymin}
function chart(host,opts){
  const box=mkCanvas(host,150);
  const PADL=44,PADR=8,PADT=6,PADB=18;
  let geom=null;
  function render(){
    box.draw((g,w,h)=>{
      const X0=PADL, X1=w-PADR, Y0=PADT, Y1=h-PADB;
      const muted=css("--muted"), grid=css("--grid"), panel=css("--panel");
      let lo=opts.ymin!==undefined&&opts.ymin!==null?opts.ymin:Infinity, hi=-Infinity;
      if (opts.stack){
        for (let y=0;y<NYR;y++){ let s=0;
          for (const sr of opts.series){ const v=sr.vals[y]; if (isFinite(v)) s+=v; }
          hi=Math.max(hi,s); }
        lo=0;
      } else {
        for (const sr of opts.series) for (const v of sr.vals)
          if (isFinite(v)){ lo=Math.min(lo,v); hi=Math.max(hi,v); }
        if (!isFinite(lo)){ lo=0; hi=1; }
        if (opts.ymin!==undefined&&opts.ymin!==null) lo=opts.ymin;
      }
      const empty=!isFinite(hi);
      if (empty){ lo=0; hi=1; }
      if (hi<=lo) hi=lo+1;
      const pad=(hi-lo)*0.06;
      if (opts.ymin===undefined||opts.ymin===null) lo-=pad;
      hi+=pad;
      const xs=(y)=>X0+(X1-X0)*(NYR>1?y/(NYR-1):0.5);
      const ys=(v)=>Y1-(Y1-Y0)*(v-lo)/(hi-lo);
      g.font="10px 'IBM Plex Mono',monospace"; g.fillStyle=muted; g.strokeStyle=grid; g.lineWidth=1;
      // two ticks can round to the same label when the series is
      // nearly constant: the label is not repeated, the line is still drawn.
      let prevLab=null;
      for (const t of niceTicks(lo,hi,4)){
        const y=ys(t); g.beginPath(); g.moveTo(X0,y); g.lineTo(X1,y); g.stroke();
        const lab=opts.fmt.format(t);
        if (lab!==prevLab){
          g.textAlign="right"; g.textBaseline="middle"; g.fillText(lab,X0-5,y);
          prevLab=lab;
        }
      }
      g.textBaseline="top";
      const ticks=[...new Set([0,Math.floor((NYR-1)/2),NYR-1])];
      for (const yi of ticks){
        g.textAlign = yi===0 ? "left" : (yi===NYR-1 ? "right" : "center");
        g.fillText(YEARS[yi],xs(yi),Y1+4);
      }
      g.strokeStyle=css("--line"); g.beginPath(); g.moveTo(X0,Y1); g.lineTo(X1,Y1); g.stroke();
      if (empty){
        g.fillStyle=muted; g.textAlign="center"; g.textBaseline="middle";
        g.font="11px 'IBM Plex Sans',sans-serif";
        g.fillText("no data in this run",(X0+X1)/2,(Y0+Y1)/2);
      } else if (opts.stack){
        const base=new Float64Array(NYR);
        for (const sr of opts.series){
          const tops=new Float64Array(NYR);
          for (let y=0;y<NYR;y++){ const v=isFinite(sr.vals[y])?sr.vals[y]:0; tops[y]=base[y]+v; }
          g.beginPath();
          g.moveTo(xs(0),ys(base[0]));
          for (let y=1;y<NYR;y++) g.lineTo(xs(y),ys(base[y]));
          for (let y=NYR-1;y>=0;y--) g.lineTo(xs(y),ys(tops[y]));
          g.closePath();
          g.fillStyle=colOf(sr); g.fill();
          // 2 px of background between two strata: the boundaries stay legible
          g.strokeStyle=panel; g.lineWidth=2; g.stroke();
          base.set(tops);
        }
      } else {
        for (const sr of opts.series){
          g.strokeStyle=colOf(sr); g.lineWidth=sr.w||2; g.lineJoin="round";
          g.beginPath(); let pen=false;
          for (let y=0;y<NYR;y++){ const v=sr.vals[y];
            if (!isFinite(v)){ pen=false; continue; }
            if (!pen){ g.moveTo(xs(y),ys(v)); pen=true; } else g.lineTo(xs(y),ys(v)); }
          g.stroke();
          // an isolated year draws no segment: mark it with a dot
          if (NYR===1 && isFinite(sr.vals[0])){
            g.fillStyle=colOf(sr); g.beginPath(); g.arc(xs(0),ys(sr.vals[0]),4,0,6.284); g.fill();
          }
        }
      }
      geom={X0,X1,Y0,Y1,xs};
    });
  }
  render();
  collector.push(render);
  box.c.addEventListener("mousemove",(e)=>{
    if (!geom) return;
    const b=box.c.getBoundingClientRect(), mx=e.clientX-b.left;
    if (mx<geom.X0||mx>geom.X1){ chartip.style.display="none"; render(); return; }
    const y=Math.max(0,Math.min(NYR-1,Math.round((mx-geom.X0)/(geom.X1-geom.X0)*(NYR-1))));
    render();
    const g=box.c.getContext("2d"); g.setTransform(DPR,0,0,DPR,0,0);
    g.strokeStyle=css("--muted"); g.lineWidth=1; g.setLineDash([3,3]);
    g.beginPath(); g.moveTo(geom.xs(y),geom.Y0); g.lineTo(geom.xs(y),geom.Y1); g.stroke(); g.setLineDash([]);
    let html=`<div class="row" style="color:var(--muted)">${YEARS[y]}</div>`;
    for (const sr of opts.series){
      const v=sr.vals[y];
      html+=`<div class="row"><i style="background:${colOf(sr)}"></i>${sr.name}
             <span class="v">${isFinite(v)?opts.fmt.format(v):"—"}</span></div>`;
    }
    chartip.innerHTML=html; chartip.style.display="block";
    chartip.style.left=Math.min(e.clientX+14,window.innerWidth-170)+"px";
    chartip.style.top=(e.clientY+12)+"px";
  });
  box.c.addEventListener("mouseleave",()=>{ chartip.style.display="none"; render(); });
}
function donut(host,parts,title,onPick,selGid){
  const wrap=document.createElement("div"); wrap.className="donut";
  const c=document.createElement("canvas"); c.width=92*DPR; c.height=92*DPR;
  wrap.appendChild(c);
  const lg=document.createElement("div"); lg.className="dlgd";
  lg.innerHTML=`<span style="font-weight:600;color:var(--ink)">${title}</span>`;
  function render(){
    const g=c.getContext("2d"); g.setTransform(DPR,0,0,DPR,0,0);
    g.clearRect(0,0,92,92);
    let a0=-Math.PI/2;
    for (const pt of parts){
      const a1=a0+2*Math.PI*pt.frac;
      g.beginPath(); g.moveTo(46,46); g.arc(46,46,44,a0,a1); g.closePath();
      g.fillStyle=pt.color; g.fill();
      g.strokeStyle=css("--panel"); g.lineWidth=2; g.stroke();
      a0=a1;
    }
    g.beginPath(); g.arc(46,46,22,0,6.2832); g.fillStyle=css("--panel"); g.fill();
  }
  render(); collector.push(render);
  for (const pt of parts){
    const d=document.createElement("div");
    d.innerHTML=`<i style="display:inline-block;width:8px;height:8px;border-radius:2px;
      background:${pt.color};margin-right:5px"></i>${pt.name} <b>${Math.round(100*pt.frac)}%</b>`;
    if (pt.gid===selGid && selGid!==undefined && selGid>=0) d.style.fontWeight="600";
    if (onPick && pt.gid!==undefined){ d.style.cursor="pointer"; d.onclick=()=>onPick(pt.gid); }
    lg.appendChild(d);
  }
  wrap.appendChild(lg); host.appendChild(wrap);
}

function openFiche(p){

  if (!ficheCache.has(p)) mkFiche(p,-1);
  activate(p);
}
function setEss(p,gid){ mkFiche(p,gid); activate(p); }
function mkFiche(p,sel){
  collector=[];

function mkTab(p){

function closeFiche(p){

  e.tab.remove(); ficheCache.delete(p);
  if (selPix===p){ selPix=-1; drawMap();
    const nxt=[...ficheCache.keys()].pop();

    else document.getElementById("fiche").innerHTML=
      `<div class="placeholder">Click a grid cell on the map to open its pixel plate.<br>

function activate(p){

  for (const [q,e] of ficheCache) e.tab.classList.toggle("on",q===p);

function panel(host,title,unit,legend){

// flux age Σ1/f̄ — generalised to NCLS classes, parameters from the config.
function fluxAgesEss(p,el){
  const F=META.flux, vi=F.ess;
  const nan=()=>Array.from({length:NCLS},()=>new Float64Array(NYR).fill(NaN));
  if (!F || vi<0) return nan();
  // without a realised rate in the run, f̄=0 and T saturates at the cap: the "ages"
  // obtained would be nothing but that cap — return NaN rather than those plateaus.
  let has=false;
  for (let k=0;k<NCLS&&!has;k++) has=essSerie(p,el,vi,k).some(v=>isFinite(v));
  if (!has) return nan();
  const ages=[], entry=new Float64Array(NYR);
  for (let k=0;k<NCLS;k++){
    const f=essSerie(p,el,vi,k), a=new Float64Array(NYR);
    for (let y=0;y<NYR;y++){
      let s=0,n=0;
      for (let t=Math.max(0,y-F.window+1);t<=y;t++){ s+=isFinite(f[t])?f[t]:0; n++; }
      const fb=s/n, T=Math.min(fb>1/F.t_max?1/fb:F.t_max,F.t_max);
      a[y]= k===NCLS-1 ? entry[y]+F.last_half : entry[y]+T/2;
      if (k<NCLS-1) entry[y]+=T;
    }
    ages.push(a);
  }
  return ages;
}
function fluxAgesAll(p){   // aggregate of the stored species, weighted by area
  const per=PIX_ESS[p].map((g,el)=>({ages:fluxAgesEss(p,el),
    areas:Array.from({length:NCLS},(_,k)=>essSerie(p,el,EAREA,k))}));
  return Array.from({length:NCLS},(_,k)=>{
    const a=new Float64Array(NYR);
    for (let y=0;y<NYR;y++){
      let num=0,den=0;
      for (const e of per){ const w=e.areas[k][y], v=e.ages[k][y];
        if (isFinite(w)&&w>0&&isFinite(v)){ num+=v*w; den+=w; } }
      a[y]=den>0?num/den:NaN;
    }
    return a;
  });
}

// Species colour: tied to the SPECIES, not to its rank within the pixel — otherwise
// the same stand would change colour from one grid cell to the next. The most
// extensive species of the domain take the 8 theme hues, the rest fall into "others".
const ESS_LIGHT=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];
const ESS_DARK =["#408cec","#e05e29","#00a671","#c37a00","#ce648d","#3aa635","#827aed","#e94f4d"];
const essRank=(()=>{
  const tot=META.essences.map((_,g)=>META.ess_share.reduce((s,r)=>s+(r[g]||0),0));
  const ord=tot.map((v,g)=>[v,g]).sort((a,b)=>b[0]-a[0]).map(e=>e[1]);
  const r=new Array(META.essences.length).fill(-1);
  ord.forEach((g,i)=>{ if (i<ESS_LIGHT.length) r[g]=i; });
  return r;
})();
function essColor(g){ const i=essRank[g];
  return i<0 ? CAT_REST : (isDark()?ESS_DARK:ESS_LIGHT)[i]; }
// Management intensity: an ORDERED scale -> sequential ramp, not hues.
function miColor(i,n){ return rampAt(RAMPS.harv, n>1 ? 0.15+0.75*i/(n-1) : 0.5); }

function buildFiche(p,sel){
  const root=document.createElement("div");
  const hasSel = sel>=0 && PIX_ESS[p].includes(sel);
  const el = hasSel ? PIX_ESS[p].indexOf(sel) : -1;
  const essName = hasSel ? META.essences[sel] : null;
  const K=[...Array(NCLS).keys()];
  // reference areas: per species (single PFT) when filtered, otherwise pixel aggregate
  const areas = hasSel ? K.map(k=>essSerie(p,el,EAREA,k)) : K.map(k=>cserie("area",k,p));
  const AME = hasSel ? 5e-4 : AMIN;        // per-species "empty slot" threshold
  const mask=(vals,k,scale)=>{ const out=new Float64Array(NYR);
    for (let y=0;y<NYR;y++)
      out[y]=(isFinite(areas[k][y])&&areas[k][y]>AME&&isFinite(vals[y]))?vals[y]*(scale||1):NaN;
    return out; };
  const fa=serie(S.area,p), lastY=NYR-1;

  const ess=META.ess_share[p].map((f,i)=>({i,f})).filter(e=>e.f>0.02).sort((a,b)=>b.f-a.f);
  const head=document.createElement("div"); head.className="fhead";
  head.innerHTML=`<h2>Pixel plate <span class="coord">${fmtCoord(p)}</span></h2>
   <div class="fmeta">land ${F0.format(META.land_area_km2[p])} km² ·
   forest ${F0.format(100*(fa[lastY]||0))} % ·
   ${ess.slice(0,2).map(e=>META.essences[e.i]).join(", ")||"—"}</div>`;
  root.appendChild(head);

  if (PIX_ESS[p].length){
    const selrow=document.createElement("div"); selrow.className="chips";
    selrow.style.marginBottom="10px";
    const mk=(label,gid)=>{ const b=document.createElement("button"); b.className="chip";
      b.textContent=label;
      if ((gid<0&&!hasSel)||(gid===sel)) b.classList.add("on");
      b.onclick=()=>setEss(p,gid);
      selrow.appendChild(b); };
    mk("All species",-1);
    for (const g of PIX_ESS[p]) mk(META.essences[g],g);
    root.appendChild(selrow);
  }
  const grid=document.createElement("div"); grid.className="fgrid";
  root.appendChild(grid);
  const sfx = hasSel ? " — "+essName : "";
  const clsLgd = K.map(k=>["class "+(k+1)+(k===NCLS-1&&NCLS>1?" (mature)":""), ()=>clsColor(k)]);
  const clsSeries = (vals)=>K.map(k=>({name:"class "+(k+1), color:()=>clsColor(k), vals:vals(k)}));

  // The panels come from atlas_config.py: adding a chart = one line
  // in PANELS, not a line of code here.
  for (const P of META.panels){
    const ess_on = hasSel && P.ess && P.essvar!==null && P.essvar!==undefined;
    // the title says what the panel REALLY shows: species suffix only
    // when the filter applies to it, "all species" mention only otherwise.
    const title = P.title + (ess_on ? sfx
                  : (hasSel && P.kind!=="series" ? " (all species)" : ""));
    if (P.kind==="stack"){
      const extra = (!hasSel && P.extra && S[P.extra]!==undefined)
        ? [{name:META.vars[P.extra]?META.vars[P.extra].label:P.extra, color:"--c0",
            vals:serie(S[P.extra],p).map(v=>(isFinite(v)?v:0)*(META.vars[P.extra]?META.vars[P.extra].scale:1))}]
        : [];
      chart(panel(grid,title,P.unit,[...clsLgd,...extra.map(e=>[e.name,e.color])]),{
        stack:true, fmt:fmtOf(P.dec), ymin:0,
        series:[...clsSeries(k=>Array.from(areas[k],v=>(isFinite(v)?v:0)*P.scale)),...extra]});

    } else if (P.kind==="classes"){
      const base = clsSeries(k=>ess_on ? mask(essSerie(p,el,P.essvar,k),k,P.scale)
                                       : mask(cserie(P.var,k,p),k,P.scale));
      const extra=[];
      if (ess_on && P.pixel){    // aggregate of the filtered species: mixing effect
        const a=new Float64Array(NYR);
        for (let y=0;y<NYR;y++){ let num=0,den=0;
          for (const k of K){ const w=areas[k][y], v=essVal(p,el,P.essvar,k,y);
            if (isFinite(w)&&isFinite(v)){ num+=w*v; den+=w; } }
          a[y]=den>1e-4?P.scale*num/den:NaN; }
        extra.push({name:essName+" (weighted)",color:"--muted",w:2.2,vals:a});
      }
      if (P.pixel) extra.push({name:"pixel (all species)",color:"--ink",w:2.6,
        vals:serie(S[P.var],p).map(v=>v*P.scale)});
      chart(panel(grid,title,P.unit,[...clsLgd,...extra.map(e=>[e.name,e.color])]),{
        fmt:fmtOf(P.dec), ymin:P.ymin, series:[...base,...extra]});

    } else if (P.kind==="flux_age"){
      const fc = ess_on ? fluxAgesEss(p,el) : fluxAgesAll(p);
      const extra = P.pixel ? [{name:"pixel (all species)",color:"--ink",w:2.6,
        vals:serie(S.age_flux,p)}] : [];
      chart(panel(grid,title,P.unit,[...clsLgd,...extra.map(e=>[e.name,e.color])]),{
        fmt:fmtOf(P.dec), ymin:P.ymin,
        series:[...clsSeries(k=>mask(fc[k],k,1)),...extra]});

    } else {   // series
      const solo=P.series.length===1;
      const sr=P.series.map((s,i)=>({name:s.label, color:solo?"--accent":()=>catColor(i),
        vals:serie(S[s.key],p).map(v=>v*s.scale)}));
      chart(panel(grid,title,P.unit,sr.map((s,i)=>[s.name,s.color])),{
        fmt:fmtOf(P.dec), ymin:P.ymin, series:sr});
    }
  }

  // pie charts: species composition, and management intensity when provided
  const dn=document.createElement("div"); dn.className="donuts";
  const parts=[]; let cum=0;
  ess.slice(0,5).forEach(e=>{ parts.push({name:META.essences[e.i], frac:e.f,
    color:essColor(e.i), ...(PIX_ESS[p].includes(e.i)?{gid:e.i}:{})}); cum+=e.f; });
  if (cum<0.999) parts.push({name:"others",frac:1-cum,color:CAT_REST});
  donut(dn,parts,`Species (area, ${Math.min(5,NYR)} last years)`,(g)=>setEss(p,g),sel);
  if (META.mi_labels.length && META.fm_share.length){
    const fmp=META.fm_share[p].map((f,i)=>({name:META.mi_labels[i],frac:f,
      color:miColor(i,META.mi_labels.length)})).filter(e=>e.frac>0.005);
    if (fmp.length) donut(dn,fmp,"Management intensity");
  }
  if (dn.children.length) root.appendChild(dn);
  return root;
}
